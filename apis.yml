apis:
- name: Soylent Agent Commerce (UCP / MCP)
  description: >-
    Agent-facing commerce surface for the Soylent storefront implementing the
    Universal Commerce Protocol over MCP: catalog search, cart, checkout, and
    fulfillment with a buyer-approval invariant on payment. Discoverable via
    /.well-known/ucp and /llms.txt; tool schemas are gated behind a UCP
    agent-profile identity handshake.
