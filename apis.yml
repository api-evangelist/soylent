aid: soylent
name: Soylent
description: >-
  Soylent is a nutrition company known for its plant-based, complete-nutrition
  meal-replacement drinks, powders, and bars, sold direct-to-consumer through its
  Shopify-powered online store at soylent.com. It reached the API Evangelist
  network as a portfolio company of a16z and GV. Soylent publishes no traditional
  developer program, but its storefront is agent-native: it implements the
  Universal Commerce Protocol (UCP) with a live MCP endpoint for agent-driven
  catalog search, cart, and buyer-approved checkout; publishes /llms.txt and
  /agents.md agent instructions; and exposes Shopify Customer Account OAuth 2.0 /
  OpenID Connect authentication with a discoverable authorization server. This
  profile captures that agent-commerce and authentication surface.
